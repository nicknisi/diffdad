name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: dad-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: dad-darwin-x86_64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: dad-linux-x86_64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: dad-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web frontend
        run: bun run build

      - name: Compile binary
        run: bun build packages/cli/src/cli.ts --compile --target=${{ matrix.target }} --outfile dad

      - name: Package tarball
        run: |
          mkdir -p dist/share/diffdad
          cp dad dist/
          cp -r packages/web/dist dist/share/diffdad/web
          cd dist
          tar czf ../${{ matrix.artifact }}.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  attach-binaries:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: '*.tar.gz'

  update-formula:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo: nicknisi/homebrew-formulae
            path: tap-formulae
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: ${{ matrix.path }}

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Update formula
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
          TAP_PATH: ${{ matrix.path }}
        run: |
          VER="${VERSION#v}"
          export SHA_DARWIN_ARM64=$(shasum -a 256 dad-darwin-arm64.tar.gz | cut -d' ' -f1)
          export SHA_DARWIN_X86_64=$(shasum -a 256 dad-darwin-x86_64.tar.gz | cut -d' ' -f1)
          export SHA_LINUX_X86_64=$(shasum -a 256 dad-linux-x86_64.tar.gz | cut -d' ' -f1)
          export SHA_LINUX_ARM64=$(shasum -a 256 dad-linux-aarch64.tar.gz | cut -d' ' -f1)
          cd "$TAP_PATH"
          sed -i "s/version \".*\"/version \"${VER}\"/" Formula/dad.rb
          # Map each exact artifact filename to its checksum. Each substitution
          # must hit exactly one formula branch; a missing/renamed branch (count
          # != 1) fails the release instead of publishing a wrong checksum.
          python3 - <<'PY'
          import os, re, sys
          f = 'Formula/dad.rb'
          txt = open(f).read()
          mapping = {
              'dad-darwin-arm64.tar.gz': os.environ['SHA_DARWIN_ARM64'],
              'dad-darwin-x86_64.tar.gz': os.environ['SHA_DARWIN_X86_64'],
              'dad-linux-x86_64.tar.gz': os.environ['SHA_LINUX_X86_64'],
              'dad-linux-aarch64.tar.gz': os.environ['SHA_LINUX_ARM64'],
          }
          for artifact, sha in mapping.items():
              pattern = re.compile(r'(' + re.escape(artifact) + r'"\n\s*sha256 ")([a-fA-F0-9]+|PLACEHOLDER_\w+)(")')
              txt, n = pattern.subn(lambda m: m.group(1) + sha + m.group(3), txt)
              if n != 1:
                  sys.exit(f'expected exactly one sha256 substitution for {artifact}, got {n}')
          open(f, 'w').write(txt)
          PY

      - name: Commit formula
        env:
          TAP_PATH: ${{ matrix.path }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd "$TAP_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dad.rb
          git diff --cached --quiet || git commit -m "dad: update to $TAG"
          git push
